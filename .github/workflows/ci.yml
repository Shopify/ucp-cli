name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codegen-drift:
    # Catch silent regressions in src/core/generated/. The generator reads
    # package.json#ucp.{releases,specBaseUrl} and fetches the published schema
    # URLs for EVERY release in the window directly; there is no repo tag
    # checkout in this pipeline. Keep this gate aligned with
    # scripts/codegen-schemas.ts instead of reintroducing a stale shadow
    # source of truth.
    name: codegen drift gate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.28.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: regenerate schemas from published spec URLs
        run: pnpm gen:schemas
      - name: assert no drift in src/core/generated/
        run: git diff --exit-code -- src/core/generated/

  check:
    name: lint + typecheck (${{ matrix.os }} / Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.28.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # `pnpm test` carries --exclude=**/*.integration.test.ts, so the
      # integration suite MUST be run separately or it is a total blind spot
      # (it was fully red on a feature branch for three phases without anyone
      # noticing, because nobody ran it locally). Do not collapse these into
      # one step; `test:integration` re-runs the build on purpose.
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:integration

  global-install:
    name: real pnpm add -g (${{ matrix.os }} / Node ${{ matrix.node }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.28.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: pack and global-install the tarball
        shell: bash
        run: |
          set -e
          pnpm pack --pack-destination ./pack-out
          tarball=$(find "$PWD/pack-out" -maxdepth 1 -name '*.tgz' -print -quit)
          pnpm add --global "$tarball"
          ucp --version
