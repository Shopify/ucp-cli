name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write       # Required for Changesets to push branches
  id-token: write       # Required for OIDC authentication
  pull-requests: write  # Required for Changesets to create PRs

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changesets:
    name: changeset release
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    environment:
      name: npm-ucp-cli
      url: https://www.npmjs.com/package/@shopify/ucp-cli
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.28.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@198f833dd7d863100ea6e28967bc9a9fdefadb0a # v2.1.0
        with:
          version: pnpm version-packages
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
          NPM_TOKEN: ""
          NODE_AUTH_TOKEN: ""
